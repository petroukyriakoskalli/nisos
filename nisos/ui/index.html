<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080B12">
<!-- use-credentials matters: the manifest is behind the token like everything
     else, and a manifest fetch sends no cookies unless you ask it to. Without
     this attribute Add to Home Screen quietly stops working. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>nisos</title>
<style>
  /* Cyber-glass, sized for a thumb. Single column, 56px+ touch targets,
     safe-area insets so it sits right when launched fullscreen from the
     home screen. */
  :root {
    --bg:#080B12; --card:rgba(150,180,220,.07); --card2:rgba(150,180,220,.13);
    --ink:#E7EEF7; --soft:#ADBCD0; --faint:#74869E;
    --rule:rgba(180,208,245,.16); --rule2:rgba(180,208,245,.09);
    --cyan:#4FD8E8; --amber:#FF8A4C; --green:#6FE4A8; --red:#FF6B6B;
    --mono: ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --hi: rgba(255,255,255,.15);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--mono); font-size:15px; line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before {
    content:""; position:fixed; inset:-30vmax; z-index:-1;
    background:
      radial-gradient(40vmax 40vmax at 15% 8%,  rgba(79,216,232,.26), transparent 62%),
      radial-gradient(44vmax 44vmax at 88% 26%, rgba(122,92,232,.24), transparent 64%),
      radial-gradient(36vmax 36vmax at 55% 92%, rgba(255,122,66,.18), transparent 62%);
    filter:blur(26px); animation:drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%{transform:translate3d(0,0,0) scale(1)}
    100%{transform:translate3d(-2vmax,2vmax,0) scale(1.05)}
  }

  /* ---- header ---- */
  header {
    flex:none; padding:16px 18px 12px;
    border-bottom:1px solid var(--rule2);
    display:flex; align-items:center; gap:10px;
  }
  .brand { font-size:17px; font-weight:600; letter-spacing:-.02em; }
  .brand em { color:var(--cyan); font-style:normal; }
  .pills { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .pill {
    font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
    padding:4px 9px; border-radius:999px; border:1px solid currentColor;
    white-space:nowrap;
  }
  .pill.on   { color:var(--green); background:rgba(111,228,168,.11); }
  .pill.off  { color:var(--faint); background:rgba(150,180,220,.08); }
  .pill.warn { color:var(--amber); background:rgba(255,138,76,.12); }

  /* ---- transcript ---- */
  main {
    flex:1; overflow-y:auto; padding:16px 18px 8px;
    display:flex; flex-direction:column; gap:12px;
    -webkit-overflow-scrolling:touch;
  }
  .empty { margin:auto; text-align:center; color:var(--faint); font-size:13px; line-height:1.9; }
  .empty b { display:block; color:var(--soft); font-size:15px; margin-bottom:6px; }

  .turn {
    border:1px solid var(--rule); background:var(--card);
    border-radius:14px; padding:12px 14px;
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    box-shadow:0 1px 0 var(--hi) inset;
  }
  /* A dictated URL or a long Greek compound must wrap, not push the card
     sideways -- one unbroken string would otherwise scroll the whole column. */
  .turn .heard { color:var(--soft); font-size:14px; overflow-wrap:anywhere; }
  .turn .said  { color:var(--green); font-size:14.5px; margin-top:7px; overflow-wrap:anywhere; }
  .turn .said.bad { color:var(--red); }
  .turn .meta {
    margin-top:9px; padding-top:8px; border-top:1px solid var(--rule2);
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint);
  }
  .chip {
    padding:3px 8px; border-radius:999px;
    background:rgba(79,216,232,.12); color:var(--cyan);
    border:1px solid rgba(79,216,232,.3);
  }
  .chip.amber { background:rgba(255,138,76,.13); color:var(--amber); border-color:rgba(255,138,76,.32); }
  .chip.bad   { background:rgba(255,107,107,.13); color:var(--red);  border-color:rgba(255,107,107,.32); }

  /* ---- controls ---- */
  footer {
    flex:none; padding:12px 18px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--rule2);
    background:rgba(8,11,18,.72);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  }
  .speak {
    width:100%; min-height:64px; border:none; border-radius:18px;
    font-family:var(--mono); font-size:15px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:#06090F;
    background:linear-gradient(180deg,#6FE4F0,#33C2D4);
    box-shadow:0 0 30px -8px var(--cyan); cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:12px;
    transition:transform .08s ease, filter .15s ease;
  }
  .speak:active { transform:scale(.985); }
  .speak[disabled] { filter:grayscale(.5) brightness(.7); cursor:default; }
  .speak.listening {
    background:linear-gradient(180deg,#FFB07A,#F06E32);
    box-shadow:0 0 34px -6px var(--amber);
  }
  .wave { display:flex; align-items:center; gap:3px; height:20px; }
  .wave i {
    width:3px; border-radius:2px; background:#06090F; height:30%;
    animation:bounce 1s ease-in-out infinite;
  }
  .wave i:nth-child(2){animation-delay:.1s} .wave i:nth-child(3){animation-delay:.2s}
  .wave i:nth-child(4){animation-delay:.3s} .wave i:nth-child(5){animation-delay:.4s}
  @keyframes bounce { 0%,100%{transform:scaleY(.35)} 50%{transform:scaleY(1.5)} }
  .elapsed { font-variant-numeric:tabular-nums; letter-spacing:.06em; opacity:.75; }

  .row { display:flex; gap:8px; margin-top:10px; }
  .row input {
    flex:1; min-width:0; min-height:48px; padding:0 14px;
    border-radius:13px; border:1px solid var(--rule);
    background:var(--card2); color:var(--ink);
    font-family:var(--mono); font-size:14px;
  }
  .row input::placeholder { color:var(--faint); }
  .row input:focus { outline:2px solid var(--cyan); outline-offset:-2px; }
  .btn {
    min-height:48px; min-width:52px; padding:0 15px;
    border-radius:13px; border:1px solid var(--rule);
    background:var(--card2); color:var(--soft);
    font-family:var(--mono); font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; cursor:pointer;
  }
  .btn:active { background:rgba(150,180,220,.2); }
  .btn.danger { color:var(--red); border-color:rgba(255,107,107,.35); }

  /* ---- goodbye ---- */
  #gone {
    position:fixed; inset:0; z-index:10; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:10px; background:rgba(8,11,18,.96); text-align:center; padding:30px;
  }
  #gone.show { display:flex; }
  #gone b { font-size:17px; }
  #gone p { color:var(--faint); font-size:13px; margin:0; max-width:34ch; line-height:1.7; }

  @media (prefers-reduced-motion: reduce) {
    body::before, .wave i { animation:none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">nis<em>o</em>s</div>
  <div class="pills">
    <span class="pill off" id="p-model">model</span>
    <span class="pill off" id="p-lang">--</span>
  </div>
</header>

<main id="log">
  <div class="empty" id="empty">
    <b>Ready</b>
    Tap Speak, or type a command below.<br>
    Greek or English — it works out which.
  </div>
</main>

<footer>
  <button class="speak" id="speak">
    <span id="speak-label">Speak</span>
  </button>
  <div class="row">
    <input id="text" placeholder="or type a command…"
           autocomplete="off" autocorrect="off" autocapitalize="none" enterkeyhint="send">
    <button class="btn" id="send">Run</button>
  </div>
  <div class="row">
    <button class="btn" id="stopmodel" style="flex:1">Stop model</button>
    <button class="btn danger" id="quit" style="flex:1">Quit</button>
  </div>
</footer>

<div id="gone">
  <b>Stopped</b>
  <p>The model is shut down and the wake lock released. Close this page — reopen
     it from your home screen whenever you need it.</p>
</div>

<script>
(function () {
  "use strict";

  // Injected by nisos/web.py at serve time. Every API call needs it: loopback
  // alone is not isolation on Android, where any other app can reach 127.0.0.1.
  var TOKEN = "__NISOS_TOKEN__";

  var log       = document.getElementById("log");
  var empty     = document.getElementById("empty");
  var speakBtn  = document.getElementById("speak");
  var speakLbl  = document.getElementById("speak-label");
  var textIn    = document.getElementById("text");
  var pModel    = document.getElementById("p-model");
  var pLang     = document.getElementById("p-lang");
  var gone      = document.getElementById("gone");

  var busy = false;
  var alive = true;

  // A turn's timeouts stack -- recording, then the recogniser, then Whisper,
  // then speaking -- so a legitimately slow one can take over a minute. Past
  // that, something is wedged, and the page has to say so rather than sit
  // there: an unbounded wait is indistinguishable from a crash.
  var TURN_TIMEOUT = 120000;

  function api(path, body, timeoutMs) {
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctrl ? window.setTimeout(function () { ctrl.abort(); },
                                         timeoutMs || TURN_TIMEOUT) : null;
    function done(x) { if (timer) window.clearTimeout(timer); return x; }

    return fetch("/api/" + path, {
      method: body === undefined ? "GET" : "POST",
      headers: {"Content-Type": "application/json", "X-Nisos-Token": TOKEN},
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { done(); return r.json(); },
            function (e) { done(); throw e; });
  }

  // ---- rendering ----------------------------------------------------
  function addTurn(t) {
    if (!t || t.error === "busy") return;
    empty.style.display = "none";

    var el = document.createElement("div");
    el.className = "turn";

    var heard = document.createElement("div");
    heard.className = "heard";
    heard.textContent = t.heard || "(nothing heard)";
    el.appendChild(heard);

    if (t.spoken) {
      var said = document.createElement("div");
      said.className = "said" + (t.failed ? " bad" : "");
      said.textContent = t.spoken;
      el.appendChild(said);
    }

    var meta = document.createElement("div");
    meta.className = "meta";
    var bad = (t.action === "unclear" || t.action === "failed" || t.action === "unavailable");
    meta.appendChild(chip(t.action || "?", bad ? "bad" : ""));
    if (t.path) meta.appendChild(chip(t.path, t.path === "reasoned" ? "amber" : ""));
    if (t.language) meta.appendChild(chip(t.language, ""));
    if (t.ms) {
      var ms = document.createElement("span");
      ms.textContent = t.ms + " ms";
      meta.appendChild(ms);
    }
    el.appendChild(meta);

    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function chip(text, extra) {
    var c = document.createElement("span");
    c.className = "chip" + (extra ? " " + extra : "");
    c.textContent = text;
    return c;
  }

  // Something went wrong at the transport level rather than in a turn: the
  // server died, the token expired, a request never came back. Say so.
  // Silently resetting the button is the worst option -- it looks identical
  // to "it heard you and had nothing to say", so you stand there repeating
  // yourself at a page that stopped working minutes ago.
  function problem(text) {
    empty.style.display = "none";
    var el = document.createElement("div");
    el.className = "turn";

    var said = document.createElement("div");
    said.className = "said bad";
    said.textContent = text;
    el.appendChild(said);

    var meta = document.createElement("div");
    meta.className = "meta";
    meta.appendChild(chip("no answer", "bad"));
    el.appendChild(meta);

    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  // Turn one API reply into either a turn card or a legible complaint.
  function settle(t) {
    setBusy(false);
    if (!t) return problem("Empty reply from the server.");
    if (t.error === "busy") return problem("Already listening — wait for it to finish.");
    if (t.error === "bad token") {
      return problem("This page is no longer signed in. Reopen it from Termux: "
                     + "bash ~/nisos/scripts/nisos-ui.sh");
    }
    if (t.error) return problem("Couldn't do that: " + t.error);
    addTurn(t);
  }

  function died(err) {
    setBusy(false);
    if (err && err.name === "AbortError") {
      // Almost always Termux:API not answering. Its commands block on a reply
      // from the Termux:API *app*, and when that is missing or wedged they
      // never return -- the same failure that hangs termux-notification.
      problem("No reply after two minutes. Termux:API is the usual cause — "
            + "check it in Termux with:  termux-battery-status");
      return;
    }
    problem("The server stopped answering. Start it again from Termux.");
  }

  var busyTimer = null;
  var busyStart = 0;

  var WAVE = '<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>';

  function setBusy(on) {
    busy = on;
    speakBtn.disabled = on;
    if (busyTimer) { window.clearInterval(busyTimer); busyTimer = null; }

    if (!on) {
      speakBtn.classList.remove("listening");
      speakLbl.textContent = "Speak";
      return;
    }

    // Count the seconds out loud. Bouncing bars say "something is happening";
    // they do not say whether it has been two seconds or ninety, and that is
    // the only question you actually have while standing there waiting.
    speakBtn.classList.add("listening");
    busyStart = Date.now();
    paintBusy();
    busyTimer = window.setInterval(paintBusy, 1000);
  }

  function paintBusy() {
    var secs = Math.floor((Date.now() - busyStart) / 1000);
    // Not before three seconds -- a fast turn shouldn't flash a number.
    speakLbl.innerHTML = WAVE + (secs >= 3
      ? ' <span class="elapsed">' + secs + 's</span>' : '');
  }

  // ---- actions ------------------------------------------------------
  speakBtn.addEventListener("click", function () {
    if (busy) return;
    setBusy(true);
    api("speak", {}).then(settle).catch(died);
  });

  function runTyped() {
    var v = textIn.value.trim();
    if (!v || busy) return;
    textIn.value = "";
    setBusy(true);
    api("text", {text: v}).then(settle).catch(died);
  }
  document.getElementById("send").addEventListener("click", runTyped);
  textIn.addEventListener("keydown", function (e) { if (e.key === "Enter") runTyped(); });

  document.getElementById("stopmodel").addEventListener("click", function () {
    api("stop_model", {}).then(refresh);
  });

  document.getElementById("quit").addEventListener("click", shutdown);

  function shutdown() {
    // explicit: you pressed Quit, so stop the server too even in app mode.
    // The pagehide beacon below deliberately does NOT say this.
    alive = false;
    api("quit", {explicit: true}).catch(function () {});
    gone.classList.add("show");
  }

  // ---- status + heartbeat -------------------------------------------
  function refresh() {
    if (!alive) return;
    api("status").then(function (s) {
      // The server decides the wording -- it is the only side that knows
      // whether this install thinks on the phone or over the network.
      var b = s.brain || { ready: s.model_running,
                           label: s.model_running ? "model ready" : "model stopped" };
      pModel.textContent = b.label;
      pModel.className = "pill " + (b.ready ? "on" : "off");
      pLang.textContent = s.language;
      pLang.className = "pill off";
      if (s.dry_run) { pLang.textContent = "dry run"; pLang.className = "pill warn"; }
    }).catch(function () {
      pModel.textContent = "no server";
      pModel.className = "pill warn";
    });
  }

  // Polling doubles as the heartbeat -- the server treats any API call as
  // proof the page is still open, and shuts the model down when they stop.
  setInterval(function () { if (alive && !document.hidden) refresh(); }, 5000);
  refresh();

  // Load whatever happened before this page was opened.
  api("status").then(function (s) { (s.history || []).forEach(addTurn); });

  // ---- closing the page stops the model ------------------------------
  // Two mechanisms, because neither is sufficient alone.
  //
  // pagehide with persisted === false means a real teardown -- swiped away,
  // closed, navigated off. Send the beacon so shutdown is immediate.
  // persisted === true means bfcache: the page may well come back in a second,
  // so do NOT kill the model, or every app-switch would cost a 10s reload.
  //
  // Everything the beacon misses -- force-kill, crash, battery pull -- is
  // caught by the server's watchdog when the heartbeat simply stops.
  window.addEventListener("pagehide", function (e) {
    if (e.persisted || !alive) return;
    try {
      navigator.sendBeacon("/api/quit?t=" + encodeURIComponent(TOKEN), new Blob([], {type: "application/json"}));
    } catch (err) { /* watchdog will handle it */ }
  });
})();
</script>
</body>
</html>
