<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Home-screen icon. A microphone grille reading as a sound wave: the two
       things the app is. Deliberately flat and high-contrast so it survives
       being scaled to 48px on a busy wallpaper. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FE4F0"/>
      <stop offset="1" stop-color="#33C2D4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#080B12"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1C2A3A" stroke-width="14"/>
  <g stroke="url(#g)" stroke-width="26" stroke-linecap="round">
    <line x1="150" y1="256" x2="150" y2="256"/>
    <line x1="196" y1="206" x2="196" y2="306"/>
    <line x1="242" y1="164" x2="242" y2="348"/>
    <line x1="288" y1="196" x2="288" y2="316"/>
    <line x1="334" y1="226" x2="334" y2="286"/>
  </g>
  <circle cx="150" cy="256" r="15" fill="#FF8A4C"/>
</svg>
