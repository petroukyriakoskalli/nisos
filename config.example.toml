# nisos configuration.
#
# Copy this to config.toml (same folder) or ~/.nisos/config.toml and edit.
# Anything you leave out falls back to the defaults in nisos/config.py, so a
# half-finished file still boots -- handy when you are editing over SSH.

[general]
# Starting guess for the fast recogniser. The router corrects this whenever you
# speak the other language, so it does not need to be kept accurate -- set it
# to whichever language you use most.
language = "el"

dry_run  = false
log_file = "~/.nisos/nisos.log"


[audio]
seconds     = 8                    # hard cap on one recording
sample_rate = 16000                # what whisper.cpp expects
path        = "~/.nisos/input.wav" # ALWAYS the same path, so it overwrites


[stt]
# race    -- fire both recognisers, take Android's if the router accepts it.
#            Fast path stays ~1.0s, and the other language still works.
# android -- fastest and most accurate, but only in your device locale.
# whisper -- auto-detects both languages, costs 0.7s on every command.
strategy = "race"

whisper_bin   = "~/nisos/bin/whisper-cli"
# MULTILINGUAL weights. Using ggml-small.en here is the single easiest way to
# build this whole thing and then discover it only speaks English.
whisper_model = "~/nisos/models/ggml-small-q5_1.bin"

android_timeout = 8.0
whisper_timeout = 20.0


[brain]
# Who answers a phrase the router missed.
#
#   claude  the Anthropic API. Nothing to install, far better answers, and
#           much better Greek. Needs a network and a key, costs per turn, and
#           the transcript leaves the phone.
#   llama   llama-server on this device. Private, free per turn, 2.5 GB.
#   auto    claude when a key is present, otherwise llama. This is the default,
#           and on a lost network it drops back to llama-server if it happens
#           to be running.
#
# Either way the router still answers ~80% of commands here, with no model of
# any kind involved -- "άναψε τον φακό" never leaves the phone.
backend = "auto"

# -- llama-server (offline) ------------------------------------------------
url         = "http://127.0.0.1:8080"
grammar     = "grammar/action.gbnf"
timeout     = 40.0
max_tokens  = 128
temperature = 0.2   # llama only; the API rejects sampling parameters


# -- Claude API (online) ---------------------------------------------------
[brain.cloud]
# There is deliberately NO key setting here. It lives in its own 0600 file, so
# the config stays something you can paste into a bug report. Put one there
# with:  python -m nisos --set-key   (or menu key 'k')
key_file = "~/.nisos/anthropic-key"

model = "claude-opus-5"

# Caps thinking and reply together. A cap is not a charge -- only the tokens
# actually produced are billed -- so being generous here costs nothing and
# stops a long answer being cut off mid-sentence.
max_tokens = 2048

# low | medium | high | xhigh | max. Classifying one spoken sentence is the
# textbook case for "low", and this runs while you stand there holding a phone.
# Raise it if you ask it real questions and want better answers.
effort = "low"

# adaptive | off. Leave it on: with thinking off the model occasionally writes
# its tool call as ordinary text, and a command that silently does nothing is
# the worst failure this program has.
thinking = "adaptive"

# Retry on another model if the safety filters decline a request. "" disables
# it -- do that if you ever see an HTTP 400 mentioning fallbacks or a beta
# header, which would mean the model in use doesn't take this.
fallbacks = "default"

timeout = 30.0

# ⚠️ If you point `model` at an older model (Haiku 4.5, for instance) you must
# also clear `effort` and `thinking` -- those models reject both, and every
# reasoned turn would fail with an HTTP 400.
#   effort   = ""
#   thinking = ""


[speech]
# android -- system voices, both languages, zero extra storage. Recommended.
# piper   -- better English, but Greek is one low-quality voice and +150 MB.
engine = "android"

[speech.voices]
en = "en-GB"
el = "el-GR"

[speech.piper_models]
en = "~/nisos/voices/en_GB-alba-medium.onnx"
el = "~/nisos/voices/el_GR-rapunzelina-low.onnx"


[ui]
# The web UI. `scripts/app-mode.sh on` writes these two for you -- edit by
# hand only if you want something other than the two sensible combinations.

# Stop llama-server when you close the page. Leave this true: it is 2.5 GB,
# and routed commands ("torch on") never needed it anyway.
stop_model_on_exit = true

# Shut the *server* down too.
#
#   true   session mode (default) -- nothing left running, and you launch it
#          from Termux each time. The home-screen icon only works while it
#          happens to be up, which is almost never.
#   false  app mode -- an idle HTTP server stays listening, so the icon opens
#          instantly, every time. Costs a few MB of Python and nothing else,
#          because the model is still released either way.
#
# App mode also needs battery optimisation off for Termux, or Android
# eventually kills the background session and the icon goes dead again.
quit_on_exit = true

# How long the page can stop checking in before the above happens. Comfortably
# longer than the 5-second heartbeat, so switching apps for a moment does not
# throw away a model you are about to use again.
idle_shutdown_seconds = 45


[tasker]
# Optional. Only do-not-disturb and the calendar go through Tasker -- timer and
# volume are done directly now, so with these two unused Tasker can stay
# uninstalled. Setup and troubleshooting: tasker/README.md
#
# The task switches on %par1 and reads JSON arguments from %par2. Enable
# "Allow External Access" in Tasker's preferences or the broadcast is ignored
# silently -- that is the single most common reason none of this works.
task = "NisosAction"

# Where the task leaves answers a broadcast cannot return.
#
# ⚠️ This has to be on shared storage. Termux's home is private app data and
# Tasker cannot write into it without root, so a path under ~/.nisos looks
# right and can never work.
calendar_answer = "/sdcard/nisos/calendar.json"

# How long to wait for that file. Generous, because the broadcast has to wake
# Tasker before it can even start.
answer_timeout = 4.0

# Which calendar «βάλε στο ημερολόγιο» writes to, as a numeric id. Empty means
# let the Tasker task pick the first one it is allowed to write to, which is
# right on a phone with one account and a coin toss on a phone with five.
#
# To find the id, with Tasker's calendar permission granted:
#   content query --uri content://com.android.calendar/calendars \
#     --projection _id:account_name:calendar_displayName
calendar_id = ""


[contacts]
# Code-switching is this program's weakest point. A Greek-locked recogniser
# renders "Anna" phonetically, so «στείλε μήνυμα στην Άννα» arrives as «αννα»
# and matches no contact. Map the handful of people you actually text.
#
# Keys are lowercase, as the recogniser heard them. Values are the real
# contact name as stored on the phone.
"αννα"     = "Anna"
"γιωργο"   = "Giorgos"
"μαμα"     = "Mum"
