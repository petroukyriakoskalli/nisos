# Deliberately short. The Python program has no pip dependencies at all, and
# while that exact rule cannot survive on Android -- you do not hand-roll a UI
# toolkit -- the spirit does: nothing here is a convenience library. Compose is
# the UI, AndroidX is the platform, and everything else (the Claude client, the
# JSON, the router) is written out rather than pulled in.

[versions]
agp = "8.7.3"
kotlin = "2.1.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
biometric = "1.1.0"
fragment = "1.8.5"
junit = "4.13.2"
json = "20240303"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The one dependency that is not Compose or the platform, and it is still the
# platform really: BiometricPrompt is Android's own fingerprint/PIN dialog, and
# this wrapper is what makes one call work across API levels instead of three
# branches over deprecated FingerprintManager and KeyguardManager. It also
# brings androidx.fragment, which is why MainActivity is a FragmentActivity --
# the prompt is a real dialog fragment.
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# Declared only to raise the version biometric drags in, which is 1.2.5 -- from
# 2020, and actively broken with the Activity Result API.
#
# fragment 1.2.5's FragmentActivity.checkForValidRequestCode rejects any request
# code above 0xFFFF, while ActivityResultRegistry deliberately generates codes
# starting at 0x10000 so they cannot collide with legacy onActivityResult codes.
# Every launcher call is therefore a guaranteed crash:
#
#   java.lang.IllegalArgumentException: Can only use lower 16 bits for requestCode
#
# It only became reachable when MainActivity changed from ComponentActivity to
# FragmentActivity for the biometric prompt -- ComponentActivity has no such
# check. Found on a Samsung SM-S938B, Android 16.
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Android supplies org.json at runtime, but the unit-test JVM does not -- the
# android.jar used for unit tests is stubbed and every method throws. Adding
# the real thing to the test classpath is what lets the Claude client's request
# body be asserted without an emulator.
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
