# Build the app and hand back an APK you can install.
#
# This workflow is the build machine. The app is developed on a laptop with no
# Android SDK on it, so this is where the Kotlin actually gets compiled and
# where a typo becomes a red X rather than a surprise on the phone.
#
# It runs the unit tests first, on purpose. Everything in `core/` -- the
# router, the time parser, the reply tables -- is deliberately free of Android
# imports and runs on a plain JVM in about a second, so there is no reason to
# spend four minutes assembling an APK around logic that is already wrong.
#
# No Gradle wrapper is committed. A wrapper means a binary jar in a public
# repository that nobody can read, and the alternative costs one line here.

name: Android app

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # A signing key that does not change between builds.
      #
      # Runners are ephemeral and carry no ~/.android/debug.keystore, so the
      # Android Gradle Plugin generated a fresh one every run: same alias and
      # password, new key pair. Android then refuses each build as an update to
      # the last, which is exactly what the phone did. Verified rather than
      # assumed -- the APKs from run 10 and run 12 carry different signing keys.
      #
      # Held as a secret rather than committed to the repository, because a
      # public signing key lets anyone build an APK that Android will accept as
      # an update to this one, silently.
      #
      # If the secret is absent -- a fork, or before it has been set -- this step
      # is skipped and the build falls back to the plugin's generated debug key.
      # It still produces a working APK; it just cannot update an install that
      # was signed by the real key.
      # The absence check is inside the script, not in an `if:`. A step-level
      # `if` referring to the secrets context fails the whole workflow at
      # validation time -- no jobs, no logs, just a red run -- which is how the
      # first attempt at this broke.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.NISOS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "  no NISOS_KEYSTORE_B64 secret set"
            echo "  falling back to the plugin's generated debug key"
            echo "  this APK will NOT be able to update an install signed by the real key"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > nisos.jks
          echo "  restored $(stat -c%s nisos.jks) bytes"
          # Print the fingerprint, so "is every build signed the same?" is a
          # question the log answers rather than one you have to unzip an APK
          # to settle.
          keytool -list -v -keystore nisos.jks -storepass android \
            | grep -i 'SHA256:' | head -1 | sed 's/^/  /'

      # The tests that matter, and the ones that can fail fast.
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build the APK
        run: gradle --no-daemon assembleDebug

      - name: Report what came out
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "  $APK"
          ls -lh "$APK" | awk '{print "  size: " $5}'

      # Debug-signed on purpose. This is sideloaded from here, not shipped
      # through a store, so a release key would be ceremony with no benefit --
      # and a signing secret in a public repository is a real cost.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nisos-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # A rolling release, so the phone has one URL that never changes:
      #
      #   github.com/petroukyriakoskalli/nisos/releases/latest/download/nisos.apk
      #
      # An artifact cannot be that. It is a zip rather than an APK, so it needs
      # unpacking; it expires after 30 days; and downloading one requires being
      # signed into GitHub even on a public repository. A release asset has
      # none of those problems -- it is a direct, permanent, anonymous link to
      # the newest build, which is the difference between six steps on the
      # phone and one tap.
      #
      # Pushes only. A `pull_request` build republishes this asset too, which
      # means opening a PR from an old branch silently rolls the "latest" link
      # backwards -- and the whole argument for the link is that it always serves
      # the newest build. It has already happened: run 13 published from a PR,
      # then run 15 published v0.6.0 from main over the top of it.
      - name: Publish as the rolling latest build
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" nisos.apk

          NOTES="Build ${{ github.run_number }} from \`${{ github.ref_name }}\` (${GITHUB_SHA:0:7}).

          **Install:** tap \`nisos.apk\` below. It replaces any earlier build in
          place -- same signing key, so your permissions and stored key survive
          and there is nothing to uninstall first.

          Debug-signed. Play Protect will call it unrecognised; that is what
          sideloading looks like."

          # Recreate rather than edit: `gh release edit` cannot move a tag that
          # already points somewhere else, and a stale tag is how a "latest"
          # link quietly starts serving last week's build.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          # NOT a prerelease, deliberately. The /releases/latest/ pointer skips
          # prereleases, so marking this one sent that URL to the last tagged
          # release instead -- which here is v0.2.6, a set of Termux binaries
          # for a program that no longer exists. The stable link 404'd while
          # the APK sat one tag away, which is the worst kind of broken.
          gh release create latest nisos.apk \
            --title "Latest build" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  # Does it actually install, and does it actually start?
  #
  # Neither question was being asked. The build job proves the Kotlin compiles
  # and that `core/` behaves, and then published an APK that nothing had ever
  # installed or launched -- which is how two layout bugs and a signing bug all
  # reached a phone before anyone found them. "It builds" and "it runs" are
  # different claims.
  #
  # ⚠️ What this cannot test is the *phone's* policy. Samsung's Auto Blocker, the
  # per-source "install unknown apps" permission and Play Protect all refuse
  # perfectly valid APKs, and an emulator has none of them. Green here means the
  # APK is installable and starts; it does not mean a given handset will allow it.
  smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nisos-apk

      - name: Name it predictably
        run: |
          set -euo pipefail
          mv "$(find . -maxdepth 2 -name '*.apk' | head -1)" nisos.apk
          ls -lh nisos.apk

      # The emulator needs hardware acceleration to be usable, and the runner
      # has KVM but does not hand it to the job's user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35 on purpose, not the oldest thing that boots. Android 15 is where
      # the edge-to-edge change lives, and edge-to-edge is what produced both
      # layout bugs -- testing on an older image would miss the whole class.
      - name: Install and launch it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/smoke.sh nisos.apk

      # The point of the screenshots is that they are looked at. Both bugs found
      # on hardware were invisible in the source and would not have failed any
      # assertion anyone would think to write.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screen-*.png
          if-no-files-found: warn
