# Build the app and hand back an APK you can install.
#
# This workflow is the build machine. The app is developed on a laptop with no
# Android SDK on it, so this is where the Kotlin actually gets compiled and
# where a typo becomes a red X rather than a surprise on the phone.
#
# It runs the unit tests first, on purpose. Everything in `core/` -- the
# router, the time parser, the reply tables -- is deliberately free of Android
# imports and runs on a plain JVM in about a second, so there is no reason to
# spend four minutes assembling an APK around logic that is already wrong.
#
# No Gradle wrapper is committed. A wrapper means a binary jar in a public
# repository that nobody can read, and the alternative costs one line here.

name: Android app

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The tests that matter, and the ones that can fail fast.
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build the APK
        run: gradle --no-daemon assembleDebug

      - name: Report what came out
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "  $APK"
          ls -lh "$APK" | awk '{print "  size: " $5}'

      # Debug-signed on purpose. This is sideloaded from here, not shipped
      # through a store, so a release key would be ceremony with no benefit --
      # and a signing secret in a public repository is a real cost.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nisos-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # A rolling release, so the phone has one URL that never changes:
      #
      #   github.com/petroukyriakoskalli/nisos/releases/latest/download/nisos.apk
      #
      # An artifact cannot be that. It is a zip rather than an APK, so it needs
      # unpacking; it expires after 30 days; and downloading one requires being
      # signed into GitHub even on a public repository. A release asset has
      # none of those problems -- it is a direct, permanent, anonymous link to
      # the newest build, which is the difference between six steps on the
      # phone and one tap.
      - name: Publish as the rolling latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" nisos.apk

          NOTES="Build ${{ github.run_number }} from \`${{ github.ref_name }}\` (${GITHUB_SHA:0:7}).

          **Install:** tap \`nisos.apk\` below. It replaces any earlier build in
          place -- same signing key, so your permissions and stored key survive
          and there is nothing to uninstall first.

          Debug-signed. Play Protect will call it unrecognised; that is what
          sideloading looks like."

          # Recreate rather than edit: `gh release edit` cannot move a tag that
          # already points somewhere else, and a stale tag is how a "latest"
          # link quietly starts serving last week's build.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          # NOT a prerelease, deliberately. The /releases/latest/ pointer skips
          # prereleases, so marking this one sent that URL to the last tagged
          # release instead -- which here is v0.2.6, a set of Termux binaries
          # for a program that no longer exists. The stable link 404'd while
          # the APK sat one tag away, which is the worst kind of broken.
          gh release create latest nisos.apk \
            --title "Latest build" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
